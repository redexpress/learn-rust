name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (debug)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: cargo build --verbose

      - name: Build (release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --verbose

  release:
    name: release (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/lrust
            artifact: lrust-ubuntu-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/lrust.exe
            artifact: lrust-windows-x86_64.exe
          - os: macos-13
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/lrust
            artifact: lrust-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/lrust
            artifact: lrust-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --verbose --target ${{ matrix.target }}

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          mv "${{ matrix.binary }}" "release-artifacts/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-artifacts/${{ matrix.artifact }}

  publish-release:
    name: publish-release
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/lrust-ubuntu-x86_64/lrust-ubuntu-x86_64
            release-artifacts/lrust-windows-x86_64.exe/lrust-windows-x86_64.exe
            release-artifacts/lrust-macos-aarch64/lrust-macos-aarch64
            release-artifacts/lrust-macos-x86_64/lrust-macos-x86_64
          generate_release_notes: true