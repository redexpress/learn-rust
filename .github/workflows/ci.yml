name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (debug)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: cargo build --verbose --all-targets

      - name: Build (release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --verbose --all-targets

  release:
    name: release (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            archive: coreutils-ubuntu-x86_64.tar.gz
            gnuutils_archive: gnuutils-ubuntu-x86_64.tar.gz
            main_artifact: lrust-ubuntu-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: tar.gz
            archive: coreutils-windows-x86_64.tar.gz
            gnuutils_archive: gnuutils-windows-x86_64.tar.gz
            main_artifact: lrust-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            archive: coreutils-macos-aarch64.tar.gz
            gnuutils_archive: gnuutils-macos-aarch64.tar.gz
            main_artifact: lrust-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --verbose --target ${{ matrix.target }} --bins

      - name: Stage main binary
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/lrust.exe" "release-artifacts/${{ matrix.main_artifact }}"
          else
            mv "target/${{ matrix.target }}/release/lrust" "release-artifacts/${{ matrix.main_artifact }}"
            chmod +x "release-artifacts/${{ matrix.main_artifact }}"
          fi

      - name: Stage coreutils
        shell: bash
        run: |
          mkdir -p coreutils-staging
          release_dir="target/${{ matrix.target }}/release"
          exe_suffix=""
          [ "${{ matrix.os }}" = "windows-latest" ] && exe_suffix=".exe"
          for name in echo pwd true false cat; do
            src="$release_dir/$name$exe_suffix"
            [ -f "$src" ] || continue
            cp "$src" "coreutils-staging/$name$exe_suffix"
            chmod +x "coreutils-staging/$name$exe_suffix"
          done
          tar -C coreutils-staging -czf "${{ matrix.archive }}" .
          mkdir -p release-artifacts
          mv "${{ matrix.archive }}" "release-artifacts/${{ matrix.archive }}"

      - name: Stage gnuutils
        shell: bash
        run: |
          mkdir -p gnuutils-staging
          release_dir="target/${{ matrix.target }}/release"
          exe_suffix=""
          [ "${{ matrix.os }}" = "windows-latest" ] && exe_suffix=".exe"
          for name in watch tree; do
            src="$release_dir/$name$exe_suffix"
            [ -f "$src" ] || continue
            cp "$src" "gnuutils-staging/$name$exe_suffix"
            chmod +x "gnuutils-staging/$name$exe_suffix"
          done
          tar -C gnuutils-staging -czf "${{ matrix.gnuutils_archive }}" .
          mkdir -p release-artifacts
          mv "${{ matrix.gnuutils_archive }}" "release-artifacts/${{ matrix.gnuutils_archive }}"

      - name: Upload main artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.main_artifact }}
          path: release-artifacts/${{ matrix.main_artifact }}

      - name: Upload coreutils artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release-artifacts/${{ matrix.archive }}

      - name: Upload gnuutils artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gnuutils_archive }}
          path: release-artifacts/${{ matrix.gnuutils_archive }}

  test:
    name: test (cram)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release bins
        run: cargo build --release --bins

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cram
        run: pip install cram

      - name: Run cram tests
        env:
          BIN_DIR: ${{ github.workspace }}/target/release
        run: cram --verbose tests/

  publish-release:
    name: publish-release
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/lrust-ubuntu-x86_64/lrust-ubuntu-x86_64
            release-artifacts/lrust-windows-x86_64.exe/lrust-windows-x86_64.exe
            release-artifacts/lrust-macos-aarch64/lrust-macos-aarch64
            release-artifacts/coreutils-ubuntu-x86_64.tar.gz/coreutils-ubuntu-x86_64.tar.gz
            release-artifacts/coreutils-windows-x86_64.tar.gz/coreutils-windows-x86_64.tar.gz
            release-artifacts/coreutils-macos-aarch64.tar.gz/coreutils-macos-aarch64.tar.gz
            release-artifacts/gnuutils-ubuntu-x86_64.tar.gz/gnuutils-ubuntu-x86_64.tar.gz
            release-artifacts/gnuutils-windows-x86_64.tar.gz/gnuutils-windows-x86_64.tar.gz
            release-artifacts/gnuutils-macos-aarch64.tar.gz/gnuutils-macos-aarch64.tar.gz
          generate_release_notes: true
